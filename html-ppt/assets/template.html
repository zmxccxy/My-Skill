<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演示文稿标题</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #0a0e1a;
  --bg-card: #111827;
  --bg-card-hover: #1a2332;
  --accent-cyan: #06d6a0;
  --accent-blue: #118ab2;
  --accent-yellow: #ffd166;
  --accent-red: #ef476f;
  --accent-purple: #8338ec;
  --text-primary: #e8edf5;
  --text-secondary: #8899aa;
  --text-dim: #4a5568;
  --border: rgba(255,255,255,0.06);
  --glow-cyan: rgba(6, 214, 160, 0.15);
}

html { font-size: 20px; scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

.slides-wrapper {
  position: relative;
  width: 100vw;
  height: 100vh;
}

.slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 4vh 8vw;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
  overflow-y: auto;
}

.slide.active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.slide.exit-up {
  opacity: 0;
  transform: translateY(-30px);
}

.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

.bg-glow {
  position: fixed;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.12;
  pointer-events: none;
  z-index: 0;
  transition: all 1.2s ease;
}

.bg-glow-1 { background: var(--accent-cyan); top: -200px; right: -100px; }
.bg-glow-2 { background: var(--accent-blue); bottom: -300px; left: -200px; }
.bg-glow-3 { background: var(--accent-purple); top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.05; }

.nav-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  background: rgba(10, 14, 26, 0.85);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  z-index: 100;
}

.nav-progress {
  display: flex;
  gap: 6px;
  align-items: center;
}

.nav-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--text-dim);
  cursor: pointer;
  transition: all 0.3s ease;
}

.nav-dot.active {
  background: var(--accent-cyan);
  box-shadow: 0 0 12px var(--glow-cyan);
  width: 24px;
  border-radius: 4px;
}

.nav-dot:hover:not(.active) { background: var(--text-secondary); }

.nav-info {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.95rem;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 16px;
}

.nav-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 42px;
  height: 42px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  font-size: 1.1rem;
}

.nav-btn:hover {
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
  background: rgba(6, 214, 160, 0.05);
}

.nav-controls { display: flex; gap: 8px; align-items: center; }

.slide-number {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.9rem;
  color: var(--accent-cyan);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 12px;
  opacity: 0.7;
}

.slide-title {
  font-size: clamp(2.4rem, 5vw, 4rem);
  font-weight: 900;
  line-height: 1.2;
  margin-bottom: 16px;
  letter-spacing: -0.02em;
}

.slide-subtitle {
  font-size: clamp(1.2rem, 2.2vw, 1.6rem);
  color: var(--text-secondary);
  font-weight: 300;
  line-height: 1.6;
  max-width: 700px;
}

.gradient-text {
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.gradient-text-warm {
  background: linear-gradient(135deg, var(--accent-yellow), var(--accent-red));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.gradient-text-purple {
  background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero { justify-content: center; align-items: center; text-align: center; }

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 20px;
  border-radius: 100px;
  border: 1px solid rgba(6, 214, 160, 0.2);
  background: rgba(6, 214, 160, 0.05);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.95rem;
  color: var(--accent-cyan);
  margin-bottom: 32px;
}

.hero-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-cyan);
  animation: pulse 2s ease infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.hero h1 {
  font-size: clamp(3.5rem, 7vw, 6rem);
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 24px;
  letter-spacing: -0.03em;
}

.hero p {
  font-size: clamp(1.2rem, 2vw, 1.5rem);
  color: var(--text-secondary);
  max-width: 600px;
  margin: 0 auto 40px;
  line-height: 1.7;
  font-weight: 300;
}

.hero-meta {
  display: flex;
  gap: 32px;
  justify-content: center;
  font-size: 1rem;
  color: var(--text-dim);
}

.hero-meta span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.content-grid {
  display: grid;
  gap: 20px;
  margin-top: 32px;
}

.content-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.content-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.card:hover {
  border-color: rgba(6, 214, 160, 0.15);
  background: var(--bg-card-hover);
  transform: translateY(-2px);
}

.card:hover::before { opacity: 1; }

.card-icon {
  width: 52px;
  height: 52px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  margin-bottom: 16px;
}

.card-icon.cyan { background: rgba(6, 214, 160, 0.1); color: var(--accent-cyan); }
.card-icon.blue { background: rgba(17, 138, 178, 0.1); color: var(--accent-blue); }
.card-icon.yellow { background: rgba(255, 209, 102, 0.1); color: var(--accent-yellow); }
.card-icon.red { background: rgba(239, 71, 111, 0.1); color: var(--accent-red); }
.card-icon.purple { background: rgba(131, 56, 236, 0.1); color: var(--accent-purple); }

.card h3 {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 10px;
  line-height: 1.3;
}

.card p {
  font-size: 1.05rem;
  color: var(--text-secondary);
  line-height: 1.7;
}

.tag {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  font-family: 'JetBrains Mono', monospace;
}

.tag.cyan { background: rgba(6,214,160,0.1); color: var(--accent-cyan); }
.tag.yellow { background: rgba(255,209,102,0.1); color: var(--accent-yellow); }
.tag.red { background: rgba(239,71,111,0.1); color: var(--accent-red); }
.tag.purple { background: rgba(131,56,236,0.1); color: var(--accent-purple); }
.tag.blue { background: rgba(17,138,178,0.1); color: var(--accent-blue); }

.slide.active .anim-item {
  animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.anim-item {
  opacity: 0;
  transform: translateY(16px);
}

.anim-item:nth-child(1) { animation-delay: 0.1s !important; }
.anim-item:nth-child(2) { animation-delay: 0.2s !important; }
.anim-item:nth-child(3) { animation-delay: 0.3s !important; }
.anim-item:nth-child(4) { animation-delay: 0.4s !important; }
.anim-item:nth-child(5) { animation-delay: 0.5s !important; }
.anim-item:nth-child(6) { animation-delay: 0.6s !important; }
.anim-item:nth-child(7) { animation-delay: 0.7s !important; }
.anim-item:nth-child(8) { animation-delay: 0.8s !important; }

@keyframes fadeSlideUp {
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
  .slide { padding: 3vh 5vw; }
  .content-grid.cols-2, .content-grid.cols-3 { grid-template-columns: 1fr; }
  .hero-meta { flex-direction: column; gap: 8px; }
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 2px; }

.nav-btn-lg {
  width: auto !important;
  height: auto !important;
  padding: 8px 16px;
  font-size: 0.95rem !important;
  gap: 6px;
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="bg-glow bg-glow-3"></div>

<div class="slides-wrapper" id="slidesWrapper">

  <!-- ═══════════ SLIDE 0: 封面 ═══════════ -->
  <div class="slide hero active" data-index="0">
    <div class="anim-item hero-badge">标签文字</div>
    <h1 class="anim-item">
      <span class="gradient-text">主标题</span><br>副标题
    </h1>
    <p class="anim-item">
      这里是演示文稿的副标题描述，<br>简要说明本次分享的核心内容。
    </p>
    <div class="hero-meta anim-item">
      <span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        2026 年 6 月 19 日
      </span>
      <span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        演讲者姓名
      </span>
      <span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        技术栈
      </span>
    </div>
  </div>

  <!-- ═══════════ SLIDE 1: 内容页 ══════════ -->
  <div class="slide" data-index="1">
    <div class="slide-number anim-item">PART ONE / 子标题</div>
    <div class="slide-title anim-item">内容页 <span class="gradient-text">标题</span></div>

    <div class="content-grid cols-3" style="margin-top: 36px;">
      <div class="card anim-item">
        <div class="card-icon cyan">01</div>
        <h3>卡片标题一</h3>
        <p>这是卡片的描述文字，说明这个要点的核心内容。</p>
      </div>
      <div class="card anim-item">
        <div class="card-icon blue">02</div>
        <h3>卡片标题二</h3>
        <p>这是卡片的描述文字，说明这个要点的核心内容。</p>
      </div>
      <div class="card anim-item">
        <div class="card-icon purple">03</div>
        <h3>卡片标题三</h3>
        <p>这是卡片的描述文字，说明这个要点的核心内容。</p>
      </div>
    </div>
  </div>

</div>

<!-- Laser Pointer -->
<div id="laserPointer" style="position: fixed; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle, rgba(255,30,30,1) 0%, rgba(255,0,0,0.8) 30%, rgba(255,0,0,0.3) 60%, transparent 80%); pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); box-shadow: 0 0 20px rgba(255,0,0,0.8), 0 0 50px rgba(255,0,0,0.5), 0 0 80px rgba(255,0,0,0.3); display: none;"></div>

<!-- ═══════════ Navigation Bar ═══════════ -->
<div class="nav-bar">
  <div class="nav-progress" id="navProgress"></div>
  <div class="nav-info">
    <span id="slideCounter">1 / 2</span>
    <div class="nav-controls">
      <button class="nav-btn nav-btn-lg" onclick="navigate(-1)">&larr; 上一页</button>
      <button class="nav-btn nav-btn-lg" onclick="navigate(1)">下一页 &rarr;</button>
    </div>
  </div>
</div>

<script>
const slides = document.querySelectorAll('.slide');
const totalSlides = slides.length;
let currentSlide = 0;

const navProgress = document.getElementById('navProgress');
for (let i = 0; i < totalSlides; i++) {
  const dot = document.createElement('div');
  dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
  dot.onclick = () => goToSlide(i);
  navProgress.appendChild(dot);
}

function goToSlide(index) {
  if (index < 0 || index >= totalSlides || index === currentSlide) return;

  const direction = index > currentSlide ? 1 : -1;
  const current = slides[currentSlide];
  const next = slides[index];

  next.querySelectorAll('.anim-item').forEach(el => {
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = '';
  });

  current.classList.remove('active');
  if (direction > 0) {
    current.classList.add('exit-up');
    setTimeout(() => {
      current.classList.remove('exit-up');
    }, 600);
  }

  next.classList.add('active');

  document.querySelectorAll('.nav-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === index);
  });

  document.getElementById('slideCounter').textContent = `${index + 1} / ${totalSlides}`;

  currentSlide = index;
}

function navigate(direction) {
  goToSlide(currentSlide + direction);
}

function handleKey(e) {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    e.stopPropagation();
    navigate(1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    e.stopPropagation();
    navigate(-1);
  } else if (e.key === 'Home') {
    e.preventDefault();
    e.stopPropagation();
    goToSlide(0);
  } else if (e.key === 'End') {
    e.preventDefault();
    e.stopPropagation();
    goToSlide(totalSlides - 1);
  }
}
document.addEventListener('keydown', handleKey, true);

const laser = document.getElementById('laserPointer');
let laserTimeout;
document.addEventListener('mousemove', (e) => {
  laser.style.display = 'block';
  laser.style.left = e.clientX + 'px';
  laser.style.top = e.clientY + 'px';
  clearTimeout(laserTimeout);
  laserTimeout = setTimeout(() => {
    laser.style.display = 'none';
  }, 2000);
});

let touchStartY = 0;
let touchStartX = 0;
document.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
  touchStartX = e.touches[0].clientX;
});
document.addEventListener('touchend', (e) => {
  const dy = touchStartY - e.changedTouches[0].clientY;
  const dx = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 50) navigate(1);
    else if (dx < -50) navigate(-1);
  } else {
    if (dy > 50) navigate(1);
    else if (dy < -50) navigate(-1);
  }
});
</script>
</body>
</html>
